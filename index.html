<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Star Wars Wordle</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header class="hero">
      <h1>Star Wars Wordle</h1>
      <p>Listado de personajes.</p>
    </header>

    <section class="toolbar">
      <p id="status">Cargando personajes...</p>
      <button id="reset-list" type="button">Ver todo</button>
    </section>

    <section>
      <div id="characters-list" class="cards" aria-live="polite"></div>
    </section>

    <section class="pagination-wrap">
      <h2>Paginas</h2>
      <div id="pagination" class="pagination" aria-label="Paginacion de personajes"></div>
    </section>

    <section class="saved-wrap">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h2>Personajes Guardados</h2>
        <button id="reset-data" type="button" style="background: #f25c54; padding: 0.5rem 1rem; font-size: 0.9rem;">Resetear datos</button>
      </div>
      <div id="saved-characters" class="cards" aria-live="polite"></div>
    </section>

    <section class="game-wrap">
      <h2>Starwardle (Juego)</h2>
      <div class="game-controls">
        <button id="start-game">Start</button>
        <div class="autocomplete">
          <input id="guess-input" type="text" placeholder="Escribe un nombre..." autocomplete="off" />
          <div id="suggestions" class="suggestions"></div>
          <button id="check-btn">Comprobar</button>
        </div>
        <div id="check-result"></div>
        <div class="attempts-panel">
          <p class="attempts-summary">Intentos: <strong id="attempts-count">0</strong></p>
          <h3>Historial de intentos</h3>
          <ul id="attempt-history" class="attempt-history"></ul>
        </div>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
